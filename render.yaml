services:
  - type: web
    name: agente-oc-periferia
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: PORT
        value: 3000
      - key: MAX_TOKENS_POR_SESION
        value: 2000000
      - key: MAX_COSTO_USD_POR_SESION
        value: 5
